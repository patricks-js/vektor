name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd web typecheck

      - name: Lint
        run: bun run --cwd web lint

      - name: Unit tests
        run: bun run --cwd web test

      - name: Production build
        run: bun run --cwd web build

      - name: Verify demo code is tree-shaken from production bundle
        run: '! grep -q "prod-fra-01" web/dist/assets/*.js'

  backend:
    name: Backend Go (vet, race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test with race detector
        run: go test -race -count=1 ./...

  package-smoke:
    name: WebUI embed, binary check & .deb packaging
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate packaging scripts
        run: bash -n packaging/install.sh packaging/build-deb.sh

      - name: Build frontend
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web build

      - name: Test Go webui embed
        run: go test -tags webui -count=1 ./web/...

      - name: Build static vektord binary
        run: CGO_ENABLED=0 go build -tags webui -trimpath -ldflags="-s -w -X main.version=ci" -o ./bin/vektord ./cmd/vektord

      - name: Smoke test binary (--version and --check)
        run: |
          ./bin/vektord --version
          ./bin/vektord --data-dir /tmp/vektor-ci-check --check

      - name: Smoke test .deb packaging
        env:
          SKIP_WEB_BUILD: "1"
        run: |
          ./packaging/build-deb.sh 0.0.0-ci amd64
          dpkg-deb --info dist/vektor_0.0.0-ci_amd64.deb
          dpkg-deb --contents dist/vektor_0.0.0-ci_amd64.deb
