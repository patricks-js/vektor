name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tests and lint before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Frontend checks
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web typecheck
          bun run --cwd web lint
          bun run --cwd web test
          bun run --cwd web build

      - name: Backend checks
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go test -tags webui -count=1 ./web/...

  release:
    name: Build artifacts and publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve and validate SemVer tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "${TAG}" =~ ${SEMVER_RE} ]]; then
            echo "Invalid SemVer tag: ${TAG} (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build frontend assets
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web build

      - name: Build Linux tarballs and .deb packages (amd64 & arm64)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SKIP_WEB_BUILD: "1"
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            STAGE="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build \
              -tags webui -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${STAGE}/vektord" ./cmd/vektord

            install -d "${STAGE}/packaging/systemd"
            install -m 0755 packaging/install.sh "${STAGE}/packaging/install.sh"
            install -m 0644 packaging/systemd/vektord.service "${STAGE}/packaging/systemd/vektord.service"
            install -m 0644 packaging/systemd/vektord.env "${STAGE}/packaging/systemd/vektord.env"
            install -m 0644 README.md "${STAGE}/README.md"

            tar -C "${STAGE}" -czf "dist/vektor_${VERSION}_linux_${ARCH}.tar.gz" .
            rm -rf "${STAGE}"

            ./packaging/build-deb.sh "${VERSION}" "${ARCH}"
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum vektor_* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=(release create "${TAG}" dist/* --title "Vektor ${TAG}" --generate-notes)
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh "${ARGS[@]}"
          fi
