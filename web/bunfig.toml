[run]
bun = true

[install]
exact = true
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["@types/bun", "typescript"]
# Keep third-party Go sources under the hidden .bun store so go list ./... skips them.
linker = "isolated"
globalStore = true

[fmt]
sortImports = true
sortTailwindcss = true
sortPackageJson = true
ignorePatterns = [
  "vendor/",
  "dist/",
  "playwright-report/",
  "test-results/",
  "coverage/",
  "**/*.gen.ts",
  # generated by the tools below, so the formatter would fight them
  "**/generated/",
  "**/openapi.json",
  "src/lib/api/openapi.d.ts",
  # vendored skills and prose docs are not formatted
  ".agents/",
  ".claude/",
  "skills-lock.json",
  "**/*.md",
]
